[project]
name = "scout"
version = "0.1.0"
description = "Developer trend intelligence API and dashboard"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "RuslanMV" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0.0", "scikit-learn>=1.5.0"]
llm = ["openai>=1.40.0", "transformers>=4.44.0"]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]
