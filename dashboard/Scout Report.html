<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08170f" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scout" />
  <title>Scout — Your Developer Radar</title>
  <meta name="description" content="Scout your next developer advantage. Discover what to study, build, and publish next based on your location, goals, and live developer signals." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="scout.css" />
  <link rel="stylesheet" href="scout-landing.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React is vendored locally and the JSX is precompiled to plain JS, so the
       page is fully self-contained: no CDN, no in-browser Babel, works offline
       and on GitHub Pages. The .jsx files remain in the repo as source; run
       `make screenshots`/the build to recompile them into the .js served here. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <script src="scout-data.js"></script>
  <script src="scout-components.js"></script>
  <script src="scout-landing.js"></script>
  <script src="scout-drawer.js"></script>
  <script src="scout-app.js"></script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#05070e"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#5b86ff" stroke-width="2" opacity=".5"/>
      <circle cx="50" cy="50" r="16" fill="none" stroke="#35e6ff" stroke-width="2" opacity=".75"/>
      <circle cx="50" cy="50" r="6" fill="#35e6ff"/>
      <line x1="50" y1="50" x2="74" y2="36" stroke="#35e6ff" stroke-width="2"/>
      <circle cx="72" cy="37" r="4" fill="#b079ff"/>
    </svg>
  </template>
</body>
</html>
