<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scout — Developer Trend Intelligence</title>
  <meta name="description" content="Scout turns tech signals into a one-page, AI-designed action plan — know what to learn, build and publish next." />
  <link rel="icon" type="image/svg+xml" href="scout/assets/favicon.svg" />
  <!--
    Entry point for GitHub Pages when the site is published from the master
    branch. It sends visitors to the Scout web app. The recommended setup is to
    publish via GitHub Actions (Settings → Pages → Source: GitHub Actions), which
    serves the built bundle in public/ with the dashboard at the site root; this
    redirect is the zero-config fallback for branch-based publishing.
  -->
  <link rel="canonical" href="scout/" />
  <meta http-equiv="refresh" content="0; url=scout/" />
  <script>location.replace("scout/" + location.search + location.hash);</script>
  <style>
    :root{color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08170f;color:#eaf3ee;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:#54d98c;font-weight:700}
    .b{text-align:center;padding:24px}
    .g{color:#54d98c}
  </style>
</head>
<body>
  <div class="b">
    <p style="font-size:22px;margin:0 0 8px"><span class="g">◇</span> Scout</p>
    <p>Loading the app… if it doesn't redirect, <a href="scout/">open Scout →</a></p>
  </div>
</body>
</html>
