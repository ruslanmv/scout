name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          node --check scout/trends/pulse.js
          node --check scout/scout-pulse.js
          node --check scout/scout-landing.js
          node --check scout/scout-app.js
          node --check scout/scout-ranking.js
          node tests/current_roles.test.cjs
          node --check scout/quickstart/quickstart.js
          node tests/report_profile.test.cjs
      - run: pytest
