name: daily Scout dataset generation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate frontend-ready trend datasets and batches
        run: python scripts/collect_all.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SCOUT_ENABLE_LLM: ${{ vars.SCOUT_ENABLE_LLM || '0' }}
          SCOUT_LLM_PROVIDER: ${{ vars.SCOUT_LLM_PROVIDER || 'deterministic' }}
      - name: Validate dataset schema
        run: python scripts/validate_dataset.py
      - name: Build static dashboard bundle
        run: python scripts/export_for_github_pages.py
      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets public || true
          git commit -m "Update Scout trend datasets and reports" || echo "No changes"
          git push || true
