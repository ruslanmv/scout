name: daily source health check

# Probes every external source Scout depends on (signal APIs, AI gateway, course
# providers, and each recommended course/blueprint URL) and commits a timestamped
# health snapshot, so maintainers always know what is healthy and what needs a fix.

on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'   # daily, an hour after the trend snapshot

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe sources and write health snapshot
        run: python scripts/check_source_health.py --public
        env:
          # Optional keys — when set, their providers are probed instead of skipped.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Commit health snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/health public/health.json || true
          git commit -m "Update Scout source health snapshot" || echo "No changes"
          git push || true
