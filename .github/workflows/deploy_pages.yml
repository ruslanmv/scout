name: deploy pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export static site
        run: python scripts/export_for_github_pages.py
      - name: Publish static site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch public/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add gh-pages-deploy origin/gh-pages
          else
            git worktree add --detach gh-pages-deploy
          fi

          rsync -a --delete public/ gh-pages-deploy/
          cd gh-pages-deploy
          git checkout -B gh-pages
          git add -A

          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
          else
            git commit -m "Deploy GitHub Pages"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          fi
