name: deploy pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: pages
  cancel-in-progress: true

# actions/deploy-pages@v4 needs pages:write to publish and id-token:write to
# request the OIDC token — without id-token the deploy fails with
# "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Export static site
        run: python scripts/export_for_github_pages.py
      - name: Validate static site artifact
        run: |
          test -f public/index.html
          test -f public/.nojekyll
          test -f public/scout/index.html
          if find public -type d -name node_modules -print -quit | grep -q .; then
            echo "The Pages bundle must not contain node_modules" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Use an absolute path so the action can only archive the generated
          # site, rather than falling back to the repository checkout.
          path: ${{ github.workspace }}/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
